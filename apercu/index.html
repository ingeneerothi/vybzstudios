<!doctype html>
<html lang="fr" class="%CLASSE_POLICE%">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f6f5f0" />
    <title>Vertical Store — Sneakers à Abidjan</title>
    <!--ICONE-->
    <!--STYLES-->
    <style>
      html.avec-js #ecrans-fixes {
        display: none;
      }
    </style>
  </head>
  <body class="min-h-dvh">
    <!-- Si le site ne démarre pas (JavaScript bloqué ou en panne sur ce téléphone), les écrans fixes restent visibles. -->
    <script>
      (function () {
        var html = document.documentElement;
        html.classList.add("avec-js");
        function secours() {
          if (!window.__apercuPret) html.classList.remove("avec-js");
        }
        window.addEventListener("error", secours);
        setTimeout(secours, 6000);
      })();
    </script>
    <div id="racine"></div>
    <!--ECRANS-->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
